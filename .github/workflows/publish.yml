name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Started by hand rather than as a service container so the password can
      # be generated per run. Nothing is stored, so there is nothing to rotate
      # or leak, and this still works for pull requests from forks, which do
      # not receive repository secrets.
      - name: Start Postgres with a single-use password
        timeout-minutes: 5
        run: |
          PGPASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PGPASSWORD"
          echo "PGPASSWORD=$PGPASSWORD" >> "$GITHUB_ENV"

          docker run -d --name ci-postgres \
            -e POSTGRES_USER=paymentfunds \
            -e POSTGRES_PASSWORD="$PGPASSWORD" \
            -e POSTGRES_DB=PaymentFunds_Test \
            -p 5432:5432 \
            postgres:16

          for _ in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U paymentfunds -d PaymentFunds_Test; then
              exit 0
            fi
            sleep 2
          done

          echo "Postgres did not become ready in time" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Test
        run: dotnet test --configuration Release
        env:
          ConnectionStrings__TestDatabase: "Host=localhost;Port=5432;Database=PaymentFunds_Test;Username=paymentfunds;Password=${{ env.PGPASSWORD }}"

  publish:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max